# BMad Enterprise SDLC — Development Configuration
# Owner: bmad-orchestrator (all other agents READ ONLY)
project_name: mrd-search-discovery
project_description: >
  Search & discovery mini-app slice for Mr D. Free-text catalog search with
  filtering, sorting, and live enrichment (availability, price, delivery ETA)
  from a simulated flaky upstream provider.
project_type: greenfield-fullstack
owner: Success Shibambu
created: 2026-09-26

tech_stack:
  runtime: Node.js 22 LTS (>=18 supported)
  server: Express 4 + TypeScript (strict)
  client: Svelte 5 (runes) + Vite 5 + TypeScript (strict)
  tests: Vitest + Supertest
  package_manager: npm workspaces
  database: none (local JSON catalog, per assignment constraint)

accessibility_enabled: true        # WCAG 2.1 AA — keyboard nav, roles, live regions
frontend_design_enabled: false     # Token file only; no Storybook (scope discipline)
user_manual_mode: disabled         # README + SOLUTION.md cover the reviewer's needs
api_documentation: readme          # Endpoint contracts documented in README.md
performance_budget_kb: 120         # Client JS budget (gzipped), enforced at build

scope_boundaries:
  - No external database or network calls
  - Upstream provider simulated in-process
  - One filter (category) + one sort control minimum
  - Avoid over-engineering; core search flow first
